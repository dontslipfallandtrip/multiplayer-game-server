<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Multiplayer Arena</title>
    <style>
      body {
        margin: 0;
        background: #1a1a1a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
        font-family: sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }
      canvas {
        background: #111;
        border: 3px solid #ff4757;
        box-shadow: 0 0 20px rgba(255, 71, 87, 0.3);
        border-radius: 4px;
        display: none;
        max-width: 100vw;
        max-height: 100vh;
      }
      #lobby {
        background: #2f3542;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        text-align: center;
        width: 320px;
        z-index: 10;
        box-sizing: border-box;
      }
      #lobby h2 {
        margin-top: 0;
        color: #ff4757;
        letter-spacing: 1px;
      }
      #usernameInput {
        width: 100%;
        padding: 12px;
        margin: 15px 0;
        border: none;
        border-radius: 4px;
        background: #1e222b;
        color: white;
        font-size: 16px;
        text-align: center;
        box-sizing: border-box;
      }
      .control-group {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        gap: 10px;
      }
      .control-btn {
        flex: 1;
        background: #57606f;
        border: 2px solid transparent;
        color: white;
        padding: 10px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 13px;
      }
      .control-btn.active {
        background: #1e222b;
        border-color: #ff4757;
      }
      #joinBtn {
        background: #ff4757;
        color: white;
        border: none;
        padding: 14px 25px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
      }
      #status {
        font-size: 12px;
        margin-top: 12px;
        color: #a4b0be;
      }
      #info {
        position: absolute;
        top: 15px;
        text-align: center;
        width: 100%;
        pointer-events: none;
        text-transform: uppercase;
        font-size: 14px;
        letter-spacing: 1px;
        display: none;
      }
      #chatBox {
        position: absolute;
        bottom: 20px;
        left: 20px;
        width: 260px;
        height: 200px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 6px;
        display: none;
        flex-direction: column;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #444;
      }
      #chatMessages {
        flex: 1;
        overflow-y: auto;
        font-size: 13px;
        margin-bottom: 5px;
        word-wrap: break-word;
        color: #f1f2f6;
      }
      #chatInput {
        background: #1e222b;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 8px;
        color: white;
        font-size: 13px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="lobby">
      <h2>ARENA LOBBY</h2>
      <input type="text" id="usernameInput" placeholder="Enter Name..." maxlength="10" />
      <div class="control-group">
        <button type="button" class="control-btn active" id="btnKbm">⌨️ KEYBOARD</button>
        <button type="button" class="control-btn" id="btnTouch">📱 TOUCH SCREEN</button>
      </div>
      <button id="joinBtn">JOIN MATCH</button>
      <div id="status">Connecting directly via host...</div>
    </div>
    <div id="info">
      Press
      <b>Enter</b>
      to chat!
    </div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="chatBox">
      <div id="chatMessages"></div>
      <input type="text" id="chatInput" placeholder="Press Enter to type..." maxlength="50" />
    </div>
    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const info = document.getElementById("info");
      const lobby = document.getElementById("lobby");
      const usernameInput = document.getElementById("usernameInput");
      const joinBtn = document.getElementById("joinBtn");
      const statusDiv = document.getElementById("status");
      const btnKbm = document.getElementById("btnKbm");
      const btnTouch = document.getElementById("btnTouch");
      const chatBox = document.getElementById("chatBox");
      const chatMessages = document.getElementById("chatMessages");
      const chatInput = document.getElementById("chatInput");

      let ws,
        myId = null,
        players = {},
        speed = 5,
        keys = {},
        controlType = "kbm",
        isChatting = false;
      let joystick = { active: false, startX: 0, startY: 0, curX: 0, curY: 0, maxRadius: 40, moveX: 0, moveY: 0 };

      btnKbm.addEventListener("click", () => {
        controlType = "kbm";
        btnKbm.classList.add("active");
        btnTouch.classList.remove("active");
      });
      btnTouch.addEventListener("click", () => {
        controlType = "touch";
        btnTouch.classList.add("active");
        btnKbm.classList.remove("active");
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && myId) {
          if (!isChatting) {
            isChatting = true;
            chatInput.focus();
          } else {
            const msg = chatInput.value.trim();
            if (msg && ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "chat", text: msg }));
            chatInput.value = "";
            chatInput.blur();
            isChatting = false;
          }
          return;
        }
        if (isChatting) return;
        if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) e.preventDefault();
        keys[e.key.toLowerCase()] = true;
      });
      window.addEventListener("keyup", (e) => {
        if (!isChatting) keys[e.key.toLowerCase()] = false;
      });

      window.addEventListener("touchstart", (e) => {
        if (controlType !== "touch" || !myId || isChatting) return;
        joystick.active = true;
        joystick.startX = e.touches[0].clientX;
        joystick.startY = e.touches[0].clientY;
        joystick.curX = e.touches[0].clientX;
        joystick.curY = e.touches[0].clientY;
      });
      window.addEventListener("touchmove", (e) => {
        if (!joystick.active) return;
        joystick.curX = e.touches[0].clientX;
        joystick.curY = e.touches[0].clientY;
        let dx = joystick.curX - joystick.startX,
          dy = joystick.curY - joystick.startY,
          dist = Math.sqrt(dx * dx + dy * dy);
        joystick.moveX = dist > joystick.maxRadius ? dx / dist : dx / joystick.maxRadius;
        joystick.moveY = dist > joystick.maxRadius ? dy / dist : dy / joystick.maxRadius;
      });
      window.addEventListener("touchend", () => {
        joystick.active = false;
        joystick.moveX = 0;
        joystick.moveY = 0;
      });

      joinBtn.addEventListener("click", () => {
        let name = usernameInput.value.trim() || "Player";
        joinBtn.disabled = true;

        // PERFECT SYNC: Connects seamlessly to the hosting domain automatically
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${window.location.host}`);

        ws.onopen = () => ws.send(JSON.stringify({ type: "join", name: name }));
        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.type === "init") {
            myId = data.id;
            players = data.players;
            lobby.style.display = "none";
            canvas.style.display = "block";
            info.style.display = "block";
            chatBox.style.display = "flex";
          } else if (data.type === "currentPlayers") {
            for (let id in data.players) if (!players[id]) players[id] = data.players[id];
          } else if (data.type === "update") {
            if (players[data.id]) {
              if (data.id !== myId) {
                players[data.id].x += (data.player.x - players[data.id].x) * 0.3;
                players[data.id].y += (data.player.y - players[data.id].y) * 0.3;
              }
              players[data.id].chatMessage = data.player.chatMessage;
              players[data.id].chatTimer = data.player.chatTimer;
            }
          } else if (data.type === "remove") {
            delete players[data.id];
          } else if (data.type === "msg") {
            const el = document.createElement("div");
            el.innerHTML = `<strong>${data.name}:</strong> ${data.text}`;
            chatMessages.appendChild(el);
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }
        };
        ws.onerror = () => {
          joinBtn.disabled = false;
          statusDiv.innerText = "Error. Retry in a moment.";
        };
      });

      function drawGame() {
        if (canvas.style.display === "none") {
          requestAnimationFrame(drawGame);
          return;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (controlType === "kbm" && !isChatting) {
          if (keys["arrowup"] || keys["w"]) players[myId].y -= speed;
          if (keys["arrowdown"] || keys["s"]) players[myId].y += speed;
          if (keys["arrowleft"] || keys["a"]) players[myId].x -= speed;
          if (keys["arrowright"] || keys["d"]) players[myId].x += speed;
        } else if (controlType === "touch" && joystick.active) {
          players[myId].x += joystick.moveX * speed;
          players[myId].y += joystick.moveY * speed;
        }

        if (myId && players[myId]) {
          players[myId].x = Math.max(15, Math.min(canvas.width - 15, players[myId].x));
          players[myId].y = Math.max(15, Math.min(canvas.height - 15, players[myId].y));
          if (ws && ws.readyState === WebSocket.OPEN)
            ws.send(JSON.stringify({ type: "move", x: players[myId].x, y: players[myId].y }));
        }

        for (let id in players) {
          let p = players[id];
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
          ctx.fill();
          if (id === myId) {
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.stroke();
          }
          ctx.fillStyle = "white";
          ctx.font = "bold 12px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(p.name, p.x, p.y - 22);

          if (p.chatMessage && p.chatTimer > 0) {
            p.chatTimer--;
            ctx.save();
            ctx.font = "11px sans-serif";
            let w = ctx.measureText(p.chatMessage).width;
            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            ctx.beginPath();
            ctx.roundRect(p.x - w / 2 - 6, p.y - 52, w + 12, 20, 4);
            ctx.fill();
            ctx.fillStyle = "#111";
            ctx.fillText(p.chatMessage, p.x, p.y - 38);
            ctx.restore();
          }
        }
        requestAnimationFrame(drawGame);
      }
      requestAnimationFrame(drawGame);
    </script>
  </body>
</html>
