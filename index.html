<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Arena</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { background: #111; border: 3px solid #ff4757; box-shadow: 0 0 20px rgba(255, 71, 87, 0.3); border-radius: 4px; }
        #info { position: absolute; top: 15px; text-align: center; width: 100%; pointer-events: none; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="info">Move with <b>Arrow Keys</b> or <b>WASD</b>. Open multiple tabs to play!</div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Automatically matches local or live Render WebSocket connections
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        const ws = new WebSocket(wsUrl);

        let myId = null;
        let players = {};
        const speed = 5;

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === 'init') {
                myId = data.id;
                players = data.players;
            } else if (data.type === 'currentPlayers') {
                players = data.players;
            } else if (data.type === 'update') {
                players[data.id] = data.player;
            } else if (data.type === 'remove') {
                delete players[data.id];
            }
        };

        function updateMovement() {
            if (!myId || !players[myId]) return;

            let moved = false;
            let p = players[myId];

            if (keys['arrowup'] || keys['w']) { p.y -= speed; moved = true; }
            if (keys['arrowdown'] || keys['s']) { p.y += speed; moved = true; }
            if (keys['arrowleft'] || keys['a']) { p.x -= speed; moved = true; }
            if (keys['arrowright'] || keys['d']) { p.x += speed; moved = true; }

            // Wall collisions
            p.x = Math.max(15, Math.min(canvas.width - 15, p.x));
            p.y = Math.max(15, Math.min(canvas.height - 15, p.y));

            if (moved) {
                ws.send(JSON.stringify({ type: 'move', x: p.x, y: p.y }));
            }
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw every player connected to the server
            for (let id in players) {
                let p = players[id];
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
                ctx.fill();

                // Draw a targeting ring around your own piece
                if (id === myId) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }

            updateMovement();
            requestAnimationFrame(drawGame);
        }

        requestAnimationFrame(drawGame);
    </script>
</body>
</html>
